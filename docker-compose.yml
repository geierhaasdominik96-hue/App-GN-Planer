name: appplanner2

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: gn_planer
      POSTGRES_USER: gn_planer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Bitte den Server ueber das Startskript initialisieren}
    volumes:
      - gn_planer_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gn_planer -d gn_planer"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: gn-planer-app:local
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://gn_planer:${POSTGRES_PASSWORD:?Bitte den Server ueber das Startskript initialisieren}@postgres:5432/gn_planer
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Bitte den Server ueber das Startskript initialisieren}
      CONTAINERIZED: "true"
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Bitte den Server ueber das Startskript initialisieren}
      BETTER_AUTH_URL: ${PUBLIC_URL:?Bitte den Server ueber das Startskript initialisieren}
      WEB_ORIGINS: ${WEB_ORIGINS:?Bitte den Server ueber das Startskript initialisieren}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      BACKUP_DIRECTORY: /app/data/Sicherungen
      BOOTSTRAP_TEACHER_ID: ${BOOTSTRAP_TEACHER_ID:-}
      BOOTSTRAP_TEACHER_NAME: ${BOOTSTRAP_TEACHER_NAME:-}
      BOOTSTRAP_TEACHER_PASSWORD: ${BOOTSTRAP_TEACHER_PASSWORD:-}
    ports:
      - "${APP_BIND_ADDRESS:?Bitte den Server ueber das Startskript initialisieren}:3001:3001"
    volumes:
      # Nur Sicherungsdateien liegen sichtbar beim Projekt. Die laufende
      # PostgreSQL-Datenbank bleibt aus Zuverlaessigkeitsgruenden im Volume.
      - type: bind
        source: ./data/Sicherungen
        target: /app/data/Sicherungen
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

volumes:
  gn_planer_postgres:
